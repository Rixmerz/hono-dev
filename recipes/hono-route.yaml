name: hono-route
description: >
  Add a route to a Hono 4 project without colliding with or being shadowed by an
  existing one. Read-only consultation plan: it maps the route neighbourhood
  under the target prefix, proves what serves (or would shadow) the target full
  path today, re-indexes once the edit exists, inspects the new route and
  validates. The edit itself is done by the calling agent between steps `trace`
  and `reindex` — vise returns a plan, it does not dispatch. Requires the
  hono-dev plugin bound via .vise/capabilities.yaml (x.hono.* bound to the hono
  server tools); see integrations/vise/capabilities.yaml.
tier: L2
inputs:
  - workspace    # absolute project root
  - method       # HTTP method of the new route, e.g. GET
  - path         # target FULL composed path, e.g. /v1/contacts/export
  - prefix       # route neighbourhood to list, e.g. /v1/contacts
steps:
  - id: neighbourhood
    capability: x.hono.routes
    description: Routes under the prefix with their full composed paths and middleware chains
    args:
      workspace: "{{ inputs.workspace }}"
      prefix: "{{ inputs.prefix }}"
      include_middleware: true
  - id: trace
    capability: x.hono.trace
    description: Prove which route (if any) serves the target path today; a match is a duplicate (R001) and an earlier param or wildcard match is shadowing (R002)
    args:
      workspace: "{{ inputs.workspace }}"
      path: "{{ inputs.path }}"
      method: "{{ inputs.method }}"
  - id: reindex
    capability: x.hono.reindex
    description: Refresh the index after the edit so the next steps see the new route
    args:
      workspace: "{{ inputs.workspace }}"
  - id: after
    capability: x.hono.route
    description: The new route as Hono composes it — full path, middleware chain, unreached steps, validators, handler
    args:
      workspace: "{{ inputs.workspace }}"
      method: "{{ inputs.method }}"
      path: "{{ inputs.path }}"
  - id: validate
    capability: x.hono.validate
    description: Route, middleware and validation rules once the route exists (R001-R003, M001, V001)
    args:
      workspace: "{{ inputs.workspace }}"
      categories: ["routes", "middleware", "validation"]
  - id: assert
    capability: meta.assert
    description: The validator must report ok
    args:
      condition: match
      pattern: "^true$"
      against: "{{ steps.validate.output.ok }}"
